name: Update DTEK Schedule

on:
  schedule:
    # Run every 10 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run DTEK schedule script
        run: |
          python blackout_shedule.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add dtek_schedule.html dtek_schedule_all.html dtek_schedule_data.json
            git commit -m "Update DTEK schedule - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit"
            exit 0
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          include_dotfiles: false
