<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16-Day Weather Forecast (GFS)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 20px;
      background: #f0f0f0;
    }

    #chart-container {
      height: 85vh;
      width: 100vw;
      box-sizing: border-box;
      padding: 20px;
    }



    h2 {
      margin-left: 20px;
      font-size: 20px;
    }

    select {
      padding: 5px 10px;
      font-size: 14px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Mobile-friendly styles */
    @media (max-width: 768px) {
      #top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      h2 {
        margin-left: 0;
        font-size: 16px;
      }

      select {
        width: 100%;
        padding: 8px 12px;
        font-size: 16px; /* Prevents zoom on iOS */
      }

      #chart-container {
        height: 70vh;
        padding: 10px;
      }

    }

    @media (max-width: 480px) {
      h2 {
        font-size: 14px;
      }

      #chart-container {
        height: 60vh;
        padding: 5px;
      }

    }
  </style>
</head>

<body>
  <div id="top-bar">
    <label for="location">Location:&nbsp;</label>
    <select id="location">
      <option value="Kyiv">Kyiv</option>
      <option value="Yasinia">Yasinia</option>
      <option value="Dragobrat">Dragobrat</option>
      <option value="Bukovel">Bukovel</option>
	  <option value="Odesa">Odesa</option>
	  <option value="Voznesensk">Voznesensk</option>
	  <option value="Yenot">Yenot</option>
    </select>
    <h2 id="chart-title">Kyiv 16-Day Weather Forecast (GFS)</h2>
  </div>

  <div id="chart-container">
    <canvas id="forecastChart"></canvas>
  </div>

  <script>
    const locations = {
      Kyiv: { lat: 50.4328, lon: 30.46875 },
      Yasinia: { lat: 48.2742, lon: 24.3686 },
      Dragobrat: { lat: 48.1826, lon: 24.3811 },
      Bukovel: { lat: 48.3557, lon: 24.4193 },
	  Odesa: { lat: 46.4825, lon: 30.7233 },
	  Voznesensk: { lat: 47.5647, lon: 31.3364 },
	  Yenot: { "lat": 48.1733153, "lon": 24.8654665 }
    };

    let chart; // Store chart instance

    async function fetchWeather(locationName) {
      const loc = locations[locationName];

      // Запит на GFS
      const gfsUrl = `https://api.open-meteo.com/v1/gfs?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=Europe/Kiev&forecast_days=16`;
      const gfsRes = await fetch(gfsUrl);
      const gfsData = await gfsRes.json();

      // Запит на ECMWF
      const ecmwfUrl = `https://api.open-meteo.com/v1/ecmwf?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Europe/Kiev&forecast_days=16`;
      const ecmwfRes = await fetch(ecmwfUrl);
      const ecmwfData = await ecmwfRes.json();

      // Запит на GFS hourly (для детальної інформації на всі 16 днів)
      const gfsHourlyUrl = `https://api.open-meteo.com/v1/gfs?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m&timezone=Europe/Kiev&forecast_days=16`;
      const gfsHourlyRes = await fetch(gfsHourlyUrl);
      const gfsHourlyData = await gfsHourlyRes.json();

      // Запит на ECMWF hourly (для детальної інформації на всі 16 днів)
      const ecmwfHourlyUrl = `https://api.open-meteo.com/v1/ecmwf?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m&timezone=Europe/Kiev&forecast_days=16`;
      const ecmwfHourlyRes = await fetch(ecmwfHourlyUrl);
      const ecmwfHourlyData = await ecmwfHourlyRes.json();

      const dates = gfsData.daily.time;
      const tempMaxGFS = gfsData.daily.temperature_2m_max;
      const tempMinGFS = gfsData.daily.temperature_2m_min;
      const precipGFS = gfsData.daily.precipitation_sum;
      const precipProb = gfsData.daily.precipitation_probability_max;

      const tempMaxECMWF = ecmwfData.daily.temperature_2m_max;
      const tempMinECMWF = ecmwfData.daily.temperature_2m_min;
      const precipECMWF = ecmwfData.daily.precipitation_sum;

      const labelColors = [];
      const daysShort = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

      const formattedDates = dates.map(date => {
        const d = new Date(date);
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        labelColors.push(isWeekend ? 'red' : '#666');

        const day = daysShort[d.getDay()];

        return [day, date];  // !!! Повертаємо масив із двох рядків
      });

      // Prepare hourly data for all days
      const hourlyTimes = gfsHourlyData.hourly.time;
      const hourlyTemps = gfsHourlyData.hourly.temperature_2m;
      const ecmwfHourlyTimes = ecmwfHourlyData.hourly.time;
      const ecmwfHourlyTemps = ecmwfHourlyData.hourly.temperature_2m;
      
      // Create array matching daily labels length, with hourly values interpolated for all days
      const hourlyDataForChart = [];
      for (let dayIdx = 0; dayIdx < dates.length; dayIdx++) {
        if (dayIdx < dates.length) {
          // For all days, use the midday temperature from hourly data (hour 12)
          const hourIdx = dayIdx * 24 + 12;
          if (hourIdx < hourlyTemps.length) {
            hourlyDataForChart.push(hourlyTemps[hourIdx]);
          } else {
            hourlyDataForChart.push(null);
          }
        } else {
          hourlyDataForChart.push(null);
        }
      }
      
      // For detailed hourly overlay - map hourly data across all days
      // Shift left by 0.5 to start at the left edge of the first day cell
      const hourlyBaseTime = new Date(`${dates[0]}T00:00:00`);
      const hourlyDataPoints = [];
      for (let i = 0; i < Math.min(dates.length * 24, hourlyTemps.length); i++) {
        const hourTime = new Date(hourlyTimes[i]);
        const hoursFromStart = (hourTime - hourlyBaseTime) / 36e5;
        const xPos = (hoursFromStart / 24) - 0.5;
        hourlyDataPoints.push({ x: xPos, y: hourlyTemps[i] });
      }

      const hourlyDataPointsECMWF = [];
      for (let i = 0; i < Math.min(dates.length * 24, ecmwfHourlyTemps.length); i++) {
        const hourTime = new Date(ecmwfHourlyTimes[i]);
        const hoursFromStart = (hourTime - hourlyBaseTime) / 36e5;
        const xPos = (hoursFromStart / 24) - 0.5;
        hourlyDataPointsECMWF.push({ x: xPos, y: ecmwfHourlyTemps[i] });
      }

      const pointFromIndex = (idx, times, temps) => {
        const hourTime = new Date(times[idx]);
        const hoursFromStart = (hourTime - hourlyBaseTime) / 36e5;
        const xPos = (hoursFromStart / 24) - 0.5;
        return { x: xPos, y: temps[idx], t: times[idx].replace('T', ' ') };
      };

      const gfsDailyMinPoints = [];
      const gfsDailyMaxPoints = [];
      const ecmwfDailyMinPoints = [];
      const ecmwfDailyMaxPoints = [];

      for (let dayIdx = 0; dayIdx < dates.length; dayIdx++) {
        const gfsStart = dayIdx * 24;
        const gfsEnd = Math.min(gfsStart + 24, hourlyTemps.length);
        if (gfsEnd - gfsStart > 0) {
          let gfsMinIdx = gfsStart;
          let gfsMaxIdx = gfsStart;
          for (let i = gfsStart + 1; i < gfsEnd; i++) {
            if (hourlyTemps[i] < hourlyTemps[gfsMinIdx]) gfsMinIdx = i;
            if (hourlyTemps[i] > hourlyTemps[gfsMaxIdx]) gfsMaxIdx = i;
          }
          gfsDailyMinPoints.push(pointFromIndex(gfsMinIdx, hourlyTimes, hourlyTemps));
          gfsDailyMaxPoints.push(pointFromIndex(gfsMaxIdx, hourlyTimes, hourlyTemps));
        }

        const ecmwfStart = dayIdx * 24;
        const ecmwfEnd = Math.min(ecmwfStart + 24, ecmwfHourlyTemps.length);
        if (ecmwfEnd - ecmwfStart > 0) {
          let ecmwfMinIdx = ecmwfStart;
          let ecmwfMaxIdx = ecmwfStart;
          for (let i = ecmwfStart + 1; i < ecmwfEnd; i++) {
            if (ecmwfHourlyTemps[i] < ecmwfHourlyTemps[ecmwfMinIdx]) ecmwfMinIdx = i;
            if (ecmwfHourlyTemps[i] > ecmwfHourlyTemps[ecmwfMaxIdx]) ecmwfMaxIdx = i;
          }
          ecmwfDailyMinPoints.push(pointFromIndex(ecmwfMinIdx, ecmwfHourlyTimes, ecmwfHourlyTemps));
          ecmwfDailyMaxPoints.push(pointFromIndex(ecmwfMaxIdx, ecmwfHourlyTimes, ecmwfHourlyTemps));
        }
      }
      

      function getWeatherIcon(temp, prob) {
        if (temp < 0) return "❄️";
        if (prob >= 70) return "🌧️";
        if (prob >= 40) return "🌦️";
        if (prob >= 20) return "🌤️";
        return "☀️";
      }

      const ctx = document.getElementById("forecastChart").getContext("2d");
      if (chart) chart.destroy();

      // Detect if mobile device
      const isMobile = window.innerWidth <= 768;

      const hourlyLabelPlugin = {
        id: 'hourlyMinMaxLabels',
        afterDatasetsDraw(chart) {
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;
          if (!xScale || !yScale) return;

          const fontSize = isMobile ? 10 : 12;
          const ctx = chart.ctx;
          ctx.save();
          ctx.font = `bold ${fontSize}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const drawPointLabels = (points, color, yOffset) => {
            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            for (const p of points) {
              if (!p || typeof p.x !== 'number' || typeof p.y !== 'number') continue;
              const x = xScale.getPixelForValue(p.x);
              const y = yScale.getPixelForValue(p.y) + yOffset;
              const text = `${p.y.toFixed(1)}°`;
              ctx.strokeText(text, x, y);
              ctx.fillText(text, x, y);
            }
          };

          drawPointLabels(gfsDailyMaxPoints, '#1b5e20', -12);
          drawPointLabels(gfsDailyMinPoints, '#1b5e20', 12);
          drawPointLabels(ecmwfDailyMaxPoints, '#00695c', -24);
          drawPointLabels(ecmwfDailyMinPoints, '#00695c', 24);

          ctx.restore();
        }
      };

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: formattedDates,
          datasets: [
            // Hourly Temperature (all days) - Green line
            {
              type: 'line',
              label: 'GFS Hourly Temp (°C) - all days',
              data: hourlyDataPoints,
              borderColor: 'rgba(139, 195, 74, 0.9)',
              backgroundColor: 'rgba(139, 195, 74, 0.9)',
              borderWidth: 2.5,
              pointRadius: (context) => (context.dataIndex === 0 ? 3 : 0),
              pointHoverRadius: (context) => (context.dataIndex === 0 ? 6 : 3),
              pointHitRadius: 6,
              yAxisID: 'y',
              xAxisID: 'x',
              tension: 0.4,
              spanGaps: false,
              parsing: false
            },
            // ECMWF Hourly Temperature (all days) - Teal dashed line
            {
              type: 'line',
              label: 'ECMWF Hourly Temp (°C) - all days',
              data: hourlyDataPointsECMWF,
              borderColor: 'rgba(0, 150, 136, 0.9)',
              backgroundColor: 'rgba(0, 150, 136, 0.9)',
              borderDash: [4, 4],
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 3,
              pointHitRadius: 6,
              yAxisID: 'y',
              xAxisID: 'x',
              tension: 0.4,
              spanGaps: false,
              parsing: false
            },
            // GFS Hourly Min/Max (per day)
            {
              type: 'scatter',
              label: 'GFS Hourly Min',
              data: gfsDailyMinPoints,
              borderColor: 'rgba(76, 175, 80, 0.9)',
              backgroundColor: 'rgba(76, 175, 80, 0.9)',
              pointRadius: 3,
              pointHoverRadius: 5,
              pointHitRadius: 6,
              order: 10,
              yAxisID: 'y',
              xAxisID: 'x',
              parsing: false,
              datalabels: {
                display: true,
                formatter: function (value, context) {
                  const val = context.raw && typeof context.raw.y === 'number' ? context.raw.y : value;
                  return typeof val === 'number' ? `${val.toFixed(1)}°` : null;
                },
                align: function (context) {
                  return (context.dataIndex % 2 === 0) ? 'bottom' : 'top';
                },
                anchor: 'end',
                offset: function (context) {
                  return (context.dataIndex % 2 === 0) ? 10 : 4;
                },
                color: function (context) {
                  return context.dataset.borderColor || '#000';
                },
                font: {
                  weight: 'bold',
                  size: isMobile ? 8 : 10
                },
                clip: false
              }
            },
            {
              type: 'scatter',
              label: 'GFS Hourly Max',
              data: gfsDailyMaxPoints,
              borderColor: 'rgba(46, 125, 50, 0.9)',
              backgroundColor: 'rgba(46, 125, 50, 0.9)',
              pointRadius: 3,
              pointHoverRadius: 5,
              pointHitRadius: 6,
              order: 10,
              yAxisID: 'y',
              xAxisID: 'x',
              parsing: false,
              datalabels: {
                display: true,
                formatter: function (value, context) {
                  const val = context.raw && typeof context.raw.y === 'number' ? context.raw.y : value;
                  return typeof val === 'number' ? `${val.toFixed(1)}°` : null;
                },
                align: function (context) {
                  return (context.dataIndex % 2 === 0) ? 'top' : 'bottom';
                },
                anchor: 'end',
                offset: function (context) {
                  return (context.dataIndex % 2 === 0) ? 10 : 4;
                },
                color: function (context) {
                  return context.dataset.borderColor || '#000';
                },
                font: {
                  weight: 'bold',
                  size: isMobile ? 8 : 10
                },
                clip: false
              }
            },
            // ECMWF Hourly Min/Max (per day)
            {
              type: 'scatter',
              label: 'ECMWF Hourly Min',
              data: ecmwfDailyMinPoints,
              borderColor: 'rgba(0, 150, 136, 0.7)',
              backgroundColor: 'rgba(0, 150, 136, 0.7)',
              pointRadius: 3,
              pointHoverRadius: 5,
              pointHitRadius: 6,
              order: 10,
              yAxisID: 'y',
              xAxisID: 'x',
              parsing: false,
              datalabels: {
                display: true,
                formatter: function (value, context) {
                  const val = context.raw && typeof context.raw.y === 'number' ? context.raw.y : value;
                  return typeof val === 'number' ? `${val.toFixed(1)}°` : null;
                },
                align: function (context) {
                  return (context.dataIndex % 2 === 0) ? 'bottom' : 'top';
                },
                anchor: 'end',
                offset: function (context) {
                  return (context.dataIndex % 2 === 0) ? 10 : 4;
                },
                color: function (context) {
                  return context.dataset.borderColor || '#000';
                },
                font: {
                  weight: 'bold',
                  size: isMobile ? 8 : 10
                },
                clip: false
              }
            },
            {
              type: 'scatter',
              label: 'ECMWF Hourly Max',
              data: ecmwfDailyMaxPoints,
              borderColor: 'rgba(0, 121, 107, 0.7)',
              backgroundColor: 'rgba(0, 121, 107, 0.7)',
              pointRadius: 3,
              pointHoverRadius: 5,
              pointHitRadius: 6,
              order: 10,
              yAxisID: 'y',
              xAxisID: 'x',
              parsing: false,
              datalabels: {
                display: true,
                formatter: function (value, context) {
                  const val = context.raw && typeof context.raw.y === 'number' ? context.raw.y : value;
                  return typeof val === 'number' ? `${val.toFixed(1)}°` : null;
                },
                align: function (context) {
                  return (context.dataIndex % 2 === 0) ? 'top' : 'bottom';
                },
                anchor: 'end',
                offset: function (context) {
                  return (context.dataIndex % 2 === 0) ? 10 : 4;
                },
                color: function (context) {
                  return context.dataset.borderColor || '#000';
                },
                font: {
                  weight: 'bold',
                  size: isMobile ? 8 : 10
                },
                clip: false
              }
            },
            // GFS Precipitation
            {
              type: 'bar',
              label: 'GFS Precipitation (mm)',
              data: precipGFS,
              backgroundColor: 'rgba(54, 162, 235, 0.6)',
              borderColor: 'rgba(54, 162, 235, 1)',
              borderWidth: 1,
              yAxisID: 'y2'
            },
            // ECMWF Precipitation
            {
              type: 'bar',
              label: 'ECMWF Precipitation (mm)',
              data: precipECMWF,
              backgroundColor: 'rgba(153, 204, 255, 0.6)', // світліший синій
              borderColor: 'rgba(153, 204, 255, 1)',
              borderWidth: 1,
              yAxisID: 'y2'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: {
                font: {
                  size: isMobile ? 10 : 12
                },
                boxWidth: isMobile ? 20 : 40,
                padding: isMobile ? 5 : 10
              }
            },
            tooltip: {
              callbacks: {
                title: function (items) {
                  if (!items.length) return '';
                  const item = items[0];
                  const label = item.dataset.label || '';
                  if (label.includes('Hourly')) {
                    const rawTime = item.raw && item.raw.t ? item.raw.t : hourlyTimes[item.dataIndex];
                    return rawTime ? rawTime.replace('T', ' ') : 'Hourly';
                  }
                  return item.label || '';
                }
              }
            },
            datalabels: {
              display: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                return label.includes("Precipitation (mm)");
              },
              formatter: function (value, context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly Min") || label.includes("Hourly Max")) {
                  const val = (value && typeof value === 'object' && 'y' in value) ? value.y : value;
                  return typeof val === 'number' ? `${val.toFixed(1)}°` : null;
                }
                if (label.includes("GFS Precipitation")) {
                  const prob = precipProb[context.dataIndex];
                  const temp = tempMaxGFS[context.dataIndex];
                  const icon = getWeatherIcon(temp, prob);
                  return prob > 0 ? `${icon} ${prob}%` : icon;
                }

                if (label.includes("ECMWF Precipitation")) {
                  const precipAmount = precipECMWF[context.dataIndex];
                  if (precipAmount > 0) {
                    return "🌧️";
                  } else {
                    return "☀️";
                  }
                }

                return null;
              },
              align: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly Max")) return "top";
                if (label.includes("Hourly Min")) return "bottom";
                if (label.includes("Precipitation")) return "end";
                return "center";
              },
              anchor: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly")) return "end";
                if (label.includes("Precipitation")) return "start";
                return "center";
              },
              offset: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly Max")) return (context.dataIndex % 2 === 0) ? 10 : 4;
                if (label.includes("Hourly Min")) return (context.dataIndex % 2 === 0) ? 4 : 10;
                if (label.includes("Precipitation")) return 5;
                return 8;
              },
              color: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly")) return "#111";
                if (label.includes("GFS Precipitation")) return "#000";
                if (label.includes("ECMWF Precipitation")) return "#000";
                return "#000";
              },
              textStrokeColor: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                if (label.includes("Hourly Min") || label.includes("Hourly Max")) return "#fff";
                return "transparent";
              },
              textStrokeWidth: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                return (label.includes("Hourly Min") || label.includes("Hourly Max")) ? 3 : 0;
              },
              font: {
                weight: 'bold',
                size: function (context) {
                  const label = context.chart.data.datasets[context.datasetIndex].label;
                  if (label.includes("Hourly")) return isMobile ? 10 : 12;
                  return isMobile ? 9 : 11;
                }
              },
              clip: function (context) {
                const label = context.chart.data.datasets[context.datasetIndex].label;
                return !(label.includes("Hourly Min") || label.includes("Hourly Max"));
              }
            }
          },
          scales: {
            y: {
              type: 'linear',
              position: 'left',
              title: {
                display: true,
                text: 'Temperature (°C)'
              },
              ticks: {
                font: {
                  size: isMobile ? 10 : 12
                }
              },
              grid: {
                color: function (context) {
                  return context.tick.value === 0 ? '#007BFF' : Chart.defaults.borderColor;
                },
                lineWidth: function (context) {
                  return context.tick.value === 0 ? 3 : 1;
                }
              }
            },
            y2: {
              type: 'linear',
              position: 'right',
              beginAtZero: true,
              title: {
                display: true,
                text: 'Precipitation (mm)'
              },
              ticks: {
                font: {
                  size: isMobile ? 10 : 12
                }
              },
              grid: {
                drawOnChartArea: false
              }
            }
            ,
            x: {
              offset: true,
              ticks: {
                font: {
                  size: isMobile ? 10 : 12
                },
                color: function (context) {
                  return labelColors[context.index];
                },
                maxRotation: isMobile ? 45 : 0,
                minRotation: isMobile ? 45 : 0
              },
              grid: {
                display: true,
                offset: true
              }
            },
            xHourly: {
              type: 'linear',
              position: 'bottom',
              min: -0.5,
              max: dates.length - 0.5,
              display: false,
              grid: {
                drawOnChartArea: false
              },
              ticks: {
                display: false
              }
            }

          }
        },
        plugins: [hourlyLabelPlugin, ChartDataLabels]
      });

      document.getElementById("chart-title").textContent = `${locationName} 16-Day Weather Forecast (GFS + ECMWF)`;

    }

    fetchWeather("Kyiv"); // Initial load

    document.getElementById("location").addEventListener("change", async (e) => {
      await fetchWeather(e.target.value);
    });


  </script>
</body>

</html>
